[project]
name = "aircraft-track-association"
version = "0.1.0"
description = "Aircraft track association take-home"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pyproj>=3.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-exclude = ["candidate-packet"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
# Starlette's TestClient warns that it wants the separate httpx2 package; httpx works today.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
