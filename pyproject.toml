[project]
name = "aircraft-track-association"
version = "0.1.0"
description = "Aircraft track association take-home"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyproj>=3.8.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
extend-exclude = ["candidate-packet"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
